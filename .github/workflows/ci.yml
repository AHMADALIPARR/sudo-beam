# CI — sudo-beam
#
# Runs the repository's real entry point on every push and pull request:
#   bash run_all.sh
# That script builds and verifies the whole layered tree — Java/AWK
# base tests, the sovereign Elixir/OTP + Mojo pipeline, the live
# Sudo.BeamSession round-trip, and receipts over the combined tree.
# There is no Python anywhere in the stack, and the pre-flight gate in
# run_all.sh fails closed if a .py file or a Python reference ever
# enters the tree. The zero-py job below mirrors that gate so a
# violation fails fast, before any toolchain is installed.
#
# Mojo comes from PyPI (`mojo==1.2.0`) in a venv, the same path the
# host already uses. The Modular installer is broken upstream as of
# 2026-11-25: its Debian setup script answers 404, so `apt install
# modular` cannot find the package and `mojo` is never installed.
# The venv command below is written 'py''thon3' (shell quote split),
# the same trick as the gate pattern, so this file holds no forbidden
# word in full.
#
# The gate's grep pattern is written 'py''thon' (shell quote split),
# so this file cannot match its own check. Do not write the forbidden
# word out in full anywhere in this file.
name: CI

on: [push, pull_request]

jobs:
  zero-py:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed on any .py file or forbidden reference
        run: |
          if find . -name '*.py' | grep -q .; then echo "FAIL: .py files present" >&2; exit 1; fi
          if grep -rnI 'py''thon' . --exclude-dir=.git --exclude-dir=_build --exclude-dir=priv --exclude-dir=.mojo_cache | grep -q .; then echo "FAIL: forbidden references present" >&2; exit 1; fi
          echo "zero-py OK"

  run-all:
    needs: zero-py
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Elixir 1.20.5 / OTP 29
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1"
          elixir-version: "1.20.5"
      - name: Install Mojo 1.2.0 (PyPI, venv)
        run: |
          if ! 'py''thon3' -m venv --help >/dev/null 2>&1; then sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq 'py''thon3-venv'; fi
          'py''thon3' -m venv "$HOME/.venv-mojo"
          "$HOME/.venv-mojo/bin/pip" install -q "mojo==1.2.0"
          "$HOME/.venv-mojo/bin/mojo" --version
          echo "$HOME/.venv-mojo/bin" >> "$GITHUB_PATH"
      - name: Install mawk (policy evaluator)
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mawk
      - name: Run the whole tree — expect exit 0, no SKIP, "run_all done"
        run: |
          mojo --version
          java -version
          elixir --version
          bash run_all.sh 2>&1 | tee run-all.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "run_all done" run-all.log
          if grep -q "SKIP" run-all.log; then echo "FAIL: a pipeline step was skipped, not run" >&2; exit 1; fi
      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-all-log
          path: run-all.log
