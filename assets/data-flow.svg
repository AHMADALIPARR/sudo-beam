<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 920" width="780" height="920" role="img" aria-label="sudo-beam request lifecycle flowchart">
  <title>sudo-beam request lifecycle</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="920" fill="#ffffff"/>
  <text x="20" y="36" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#24292f">sudo-beam — request lifecycle</text>
  <text x="20" y="58" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">One command, from client to receipt.</text>

  <!-- 1 Command in -->
  <rect x="130" y="80" width="520" height="56" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="390" y="102" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle">1 · Command in</text>
  <text x="390" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">WebSocket text frame, or BeamSession request/3</text>
  <line x1="390" y1="136" x2="390" y2="160" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2 Gateway frames -->
  <rect x="130" y="160" width="520" height="56" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="390" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle">2 · Gateway frames the command</text>
  <text x="390" y="202" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" fill="#57606a" text-anchor="middle">u32_be length + UTF-8 command → Port {packet, 4}</text>
  <line x1="390" y1="216" x2="390" y2="240" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3 Policy decision -->
  <polygon points="390,240 560,292 390,344 220,292" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="390" y="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#24292f" text-anchor="middle">3 · AWK policy check</text>
  <text x="390" y="306" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#24292f" text-anchor="middle">allow?</text>
  <line x1="390" y1="344" x2="390" y2="368" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="398" y="362" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1a7f37">allow</text>

  <!-- Deny branch -->
  <line x1="560" y1="292" x2="600" y2="292" stroke="#cf222e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="562" y="282" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#cf222e">deny</text>
  <rect x="600" y="250" width="150" height="84" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="675" y="276" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#cf222e" text-anchor="middle">DENY</text>
  <text x="675" y="296" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="11" fill="#24292f" text-anchor="middle">{"exit": 1, ...}</text>
  <text x="675" y="312" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">stderr:</text>
  <text x="675" y="326" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="11" fill="#24292f" text-anchor="middle">sudo: policy denied</text>
  <polyline points="675,334 675,476 650,476" fill="none" stroke="#cf222e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="683" y="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#cf222e">deny path</text>

  <!-- 4 Worker executes -->
  <rect x="130" y="368" width="520" height="56" rx="6" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="390" y="390" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle">4 · Java worker executes</text>
  <text x="390" y="410" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">virtual filesystem · 16 KiB frame · 256 nodes · 4 KiB/file</text>
  <line x1="390" y1="424" x2="390" y2="448" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 5 JSON response -->
  <rect x="130" y="448" width="520" height="56" rx="6" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="390" y="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle">5 · JSON response</text>
  <text x="390" y="490" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" fill="#57606a" text-anchor="middle">{"exit": N, "stdout": "...", "stderr": "..."}</text>
  <line x1="390" y1="504" x2="390" y2="528" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 6 Response to client -->
  <rect x="130" y="528" width="520" height="56" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="390" y="550" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle">6 · Response to client</text>
  <text x="390" y="570" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" fill="#57606a" text-anchor="middle">WebSocket reply, or {:ok, %{exit:, stdout:, stderr:}}</text>
  <line x1="390" y1="584" x2="390" y2="608" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 7 Transcript -->
  <rect x="130" y="608" width="520" height="56" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="390" y="630" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle">7 · Transcript + receipt</text>
  <text x="390" y="650" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" fill="#57606a" text-anchor="middle">BeamSession writes beam_session_transcript.txt</text>
  <line x1="390" y1="664" x2="390" y2="688" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 8 holo_verify -->
  <rect x="130" y="688" width="520" height="56" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="390" y="710" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle">8 · holo_verify checks the transcript</text>
  <text x="390" y="730" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" fill="#57606a" text-anchor="middle">opcode 0x10 · SHA-256 · status 0 match / 1 mismatch / 2 error</text>
  <line x1="390" y1="744" x2="390" y2="768" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 9 Receipts -->
  <rect x="130" y="768" width="520" height="56" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="390" y="790" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle">9 · Receipts</text>
  <text x="390" y="810" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" fill="#57606a" text-anchor="middle">SHA256SUMS — 51 files combined · 32 files sovereign</text>

  <!-- Footer notes -->
  <text x="40" y="862" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#24292f">Exit codes (Java worker): 0 ok · 1 permission/operation failure · 2 invalid syntax · 127 unknown command</text>
  <text x="40" y="886" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#24292f">Deny is the default: policy.awk starts at deny; last exact match wins.</text>
</svg>
